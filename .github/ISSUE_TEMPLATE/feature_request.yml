name: Feature Request
description: Propose a new feature or improvement
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check [existing issues](https://github.com/the78mole/gdrive-fuse/issues)
        and [discussions](https://github.com/the78mole/gdrive-fuse/discussions) for similar proposals.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? Why is it needed?
      placeholder: "I'm frustrated when … / Currently there is no way to …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought about and why you prefer the proposed solution.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Component
      description: Which part of the codebase is affected?
      multiple: true
      options:
        - Authentication (Auth)
        - Drive API client (GClient)
        - FUSE operations (FuseOps)
        - Caching
        - Background change watcher
        - Build system / Makefile
        - Documentation
        - CI / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, links to related issues or external specs, etc.
    validations:
      required: false
