name: Bug Report
description: Report a reproducible bug or unexpected behaviour
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report.
        Please redact any credentials, tokens, or personal file names before submitting.

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Output of `git rev-parse --short HEAD` or the release tag
      placeholder: e.g. a1b2c3d or v0.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Ubuntu 22.04 / 24.04
        - Linux Mint 21+
        - Debian 12
        - Fedora 39+
        - Arch Linux
        - Other (describe in Additional context)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `make run CLIENT_ID=... CLIENT_SECRET=...`
        2. Open the mount point in a file manager
        3. Navigate to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Debug Log
      description: |
        Run with `--debug` and paste the relevant output here.
        **Redact** client-id, client-secret, and any personal file names.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information, screenshots, or system details.
    validations:
      required: false
