name: Deploy Manual to GitHub Pages

on:
  push:
    paths:
      - "docs/manual/**"
  pull_request:
    paths:
      - "docs/manual/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein gleichzeitiges Deployment; laufende Runs werden nicht abgebrochen,
# damit ein bereits gestartetes Deployment vollständig abgeschlossen wird.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Quarto site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto project
        working-directory: docs/manual
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/manual/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
