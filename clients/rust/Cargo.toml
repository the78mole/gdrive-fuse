[package]
name = "gdrive-fuse-rs"
version = "1.0.0"
edition = "2021"
description = "Google Drive FUSE filesystem — Rust implementation"
license = "MIT"

[[bin]]
name = "gdrive-fuse-rs"
path = "src/main.rs"

[dependencies]
# FUSE3 bindings
fuser = "0.17"

# HTTP client (blocking API to keep FUSE callbacks synchronous)
reqwest = { version = "0.13", features = ["blocking", "json", "form", "native-tls"] }

# JSON / TOML
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# URL-encode OAuth2 query params (no oauth2 crate — raw HTTP flow)
urlencoding = "2"

# Credentials / token persistence
dirs = "6"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Concurrency
parking_lot = "0.12"
dashmap = "6"
crossbeam-channel = "0.5"

# In-memory content cache with TTL and byte-based eviction
moka = { version = "0.12", features = ["sync"] }

# Persistent SQLite cache (metadata index + small-file BLOBs)
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"

# POSIX UID/GID for FUSE getattr
libc = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
httpmock = "0.8"
tempfile = "3.27.0"

[package.metadata.deb]
name = "gdrive-fuse-rs"
maintainer = "Daniel Glaser <me@the78mole.de>"
copyright = "2024-2026, Daniel Glaser <me@the78mole.de>"
license-file = ["../../LICENSE", "4"]
extended-description = """\
Mounts Google Drive as a local FUSE3 filesystem on Linux. \
Implements OAuth2 Authorization Code flow with silent token refresh, \
ETag-based 3-state directory cache, per-file content cache, \
fine-grained concurrent locking, and a background change-watcher."""
depends = "$auto, fuse3"
section = "utils"
priority = "optional"
assets = [
    { source = "target/release/gdrive-fuse-rs", dest = "usr/bin/", mode = "0755" },
]
